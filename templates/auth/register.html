{% extends "base.html" %}

{% block title %}Register - Library Management System{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center my-4">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-4 p-sm-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-info bg-opacity-25 text-info rounded-circle p-3 mb-3">
                    <i class="bi bi-person-plus-fill fs-2"></i>
                </div>
                <h3 class="fw-bold mb-1">Student Registration</h3>
                <p class="text-muted fs-7">Create your account to borrow books</p>
            </div>

            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label for="username" class="form-label text-muted small fw-semibold">USERNAME</label>
                    <div class="input-group">
                        <span class="input-group-text form-control-glass border-end-0 text-muted"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control form-control-glass border-start-0" id="username" name="username" placeholder="Choose a username" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label text-muted small fw-semibold">EMAIL ADDRESS</label>
                    <div class="input-group">
                        <span class="input-group-text form-control-glass border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control form-control-glass border-start-0" id="email" name="email" placeholder="student@university.edu" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label text-muted small fw-semibold">PASSWORD</label>
                    <div class="input-group">
                        <span class="input-group-text form-control-glass border-end-0 text-muted"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control form-control-glass border-start-0" id="password" name="password" placeholder="Create a password" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label text-muted small fw-semibold">CONFIRM PASSWORD</label>
                    <div class="input-group">
                        <span class="input-group-text form-control-glass border-end-0 text-muted"><i class="bi bi-shield-check"></i></span>
                        <input type="password" class="form-control form-control-glass border-start-0" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-gradient w-100 py-2 fs-6 mb-3">
                    <i class="bi bi-check-circle me-2"></i> Register Account
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-25">
                <p class="text-muted fs-7 mb-0">
                    Already have an account? 
                    <a href="{{ url_for('login') }}" class="text-primary text-decoration-none fw-semibold ms-1">Sign In</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
